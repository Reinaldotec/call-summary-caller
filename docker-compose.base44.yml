services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npx next dev -p 3000 -H 0.0.0.0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    env_file:
      - /run/base44/app.env
    restart: unless-stopped

volumes:
  node_modules:
